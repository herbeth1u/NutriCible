name: CI

# À placer dans .github/workflows/ (git mv github-workflows .github/workflows).
# Valide les données et lance les tests à chaque push et pull request.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valider les données
        run: npm run validate
      - name: Lancer les tests
        run: npm test
