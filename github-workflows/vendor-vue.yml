name: Vendoriser Vue

# À placer dans .github/workflows/ (git mv github-workflows .github/workflows).
# Récupère vendor/vue.esm-browser.prod.js depuis le paquet npm officiel « vue », à la version
# indiquée dans vendor/VERSIONS.md, vérifie son empreinte SHA-256 puis committe le fichier.
# Se déclenche quand VERSIONS.md change sur une branche claude/**, ou à la demande (Actions → Run workflow).
# Peut être supprimé une fois le fichier vendorisé et fusionné.

on:
  push:
    branches: ['claude/**']
    paths:
      - 'vendor/VERSIONS.md'
      - '.github/workflows/vendor-vue.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger et vérifier Vue
        run: |
          VERSION=$(grep -oE '^- vue [0-9]+\.[0-9]+\.[0-9]+' vendor/VERSIONS.md | awk '{print $3}')
          EXPECTED=$(grep -oE 'sha256 : [0-9a-f]{64}' vendor/VERSIONS.md | awk '{print $3}')
          echo "Version demandée : $VERSION"
          npm pack "vue@$VERSION" --silent
          tar -xzf "vue-$VERSION.tgz" package/dist/vue.esm-browser.prod.js
          ACTUAL=$(sha256sum package/dist/vue.esm-browser.prod.js | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Empreinte différente : attendu $EXPECTED, obtenu $ACTUAL" >&2
            exit 1
          fi
          mkdir -p vendor
          cp package/dist/vue.esm-browser.prod.js vendor/vue.esm-browser.prod.js
      - name: Committer le fichier vendorisé
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/vue.esm-browser.prod.js
          if git diff --cached --quiet; then
            echo "Rien à committer : le fichier est déjà à jour."
            exit 0
          fi
          git commit -m "chore: vendoriser Vue (voir vendor/VERSIONS.md)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME" || true
